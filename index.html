<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a1628">
<title>Phil's Rehab HQ</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0a1628;--card:#131d30;--card2:#1a2740;--orange:#e8923a;--gold:#f0c040;--text:#e8e0d8;--dim:#8899aa;--green:#4ade80;--red:#ef4444;--blue:#4da8da}
body{font-family:'Quicksand',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(1px 1px at 10% 20%,rgba(240,192,64,.5)0%,transparent 100%),radial-gradient(1px 1px at 50% 10%,rgba(255,255,255,.25)0%,transparent 100%),radial-gradient(1px 1px at 70% 40%,rgba(240,192,64,.4)0%,transparent 100%),radial-gradient(1px 1px at 90% 80%,rgba(255,255,255,.25)0%,transparent 100%),radial-gradient(1px 1px at 85% 15%,rgba(255,255,255,.3)0%,transparent 100%);pointer-events:none;z-index:0}
.container{max-width:480px;margin:0 auto;padding:16px;position:relative;z-index:1;padding-bottom:80px}
.screen{display:none}.screen.active{display:block}

/* User Select */
.user-select{text-align:center;padding-top:12vh}
.user-select h1{font-size:1.6rem;font-weight:700;margin-bottom:6px;color:var(--orange)}
.user-select p{color:var(--dim);margin-bottom:36px;font-size:.9rem}
.user-btn{display:block;width:100%;padding:20px;margin-bottom:14px;background:var(--card);border:2px solid transparent;border-radius:16px;color:var(--text);font-family:inherit;font-size:1.1rem;font-weight:600;cursor:pointer;transition:all .2s}
.user-btn:active{border-color:var(--orange);background:var(--card2);transform:scale(.98)}
.user-btn span{display:block;font-size:.8rem;font-weight:400;color:var(--dim);margin-top:4px}

/* Top Bar */
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.top-bar h1{font-size:1.05rem;font-weight:700}.top-bar h1 em{color:var(--orange);font-style:normal}
.switch-user{background:0;border:1px solid rgba(255,255,255,.12);color:var(--dim);padding:5px 12px;border-radius:8px;font-family:inherit;font-size:.75rem;cursor:pointer}

/* Phil */
.phil-section{text-align:center;margin-bottom:20px}
.phil-img{width:100%;max-width:340px;border-radius:16px;margin-bottom:10px}
.phil-quote{background:var(--card);border-radius:12px;padding:12px 16px;font-size:.85rem;line-height:1.6;position:relative;margin:0 4px}
.phil-quote::before{content:'';position:absolute;top:-7px;left:50%;transform:translateX(-50%);border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:7px solid var(--card)}

/* Stats */
.stats-bar{display:flex;gap:8px;margin-bottom:16px}
.stat-card{flex:1;background:var(--card);border-radius:12px;padding:10px 6px;text-align:center}
.stat-num{font-size:1.3rem;font-weight:700;color:var(--orange)}
.stat-label{font-size:.68rem;color:var(--dim);margin-top:2px}

/* Completion */
.comp-bar{background:rgba(255,255,255,.06);border-radius:10px;height:7px;margin-bottom:18px;overflow:hidden}
.comp-fill{height:100%;border-radius:10px;transition:width .5s,background .5s}

/* Section Header */
.sec-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sec-title{font-size:1rem;font-weight:700}
.add-btn{background:var(--orange);color:#fff;border:0;border-radius:8px;padding:6px 14px;font-family:inherit;font-size:.8rem;font-weight:600;cursor:pointer}
.add-btn:active{opacity:.7}

/* Exercise Grid */
.ex-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ex-card{background:var(--card);border-radius:14px;overflow:hidden;cursor:pointer;transition:all .2s;position:relative;animation:fadeIn .3s ease both}
.ex-card:nth-child(1){animation-delay:.05s}.ex-card:nth-child(2){animation-delay:.1s}.ex-card:nth-child(3){animation-delay:.15s}.ex-card:nth-child(4){animation-delay:.2s}.ex-card:nth-child(5){animation-delay:.25s}.ex-card:nth-child(6){animation-delay:.3s}
.ex-card.done{border:2px solid var(--green)}
.ex-card.done .ex-badge{display:flex}
.ex-img{width:100%;aspect-ratio:1;background:rgba(255,255,255,.03);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.ex-img img{width:100%;height:100%;object-fit:cover}
.ex-ph{font-size:2.2rem;opacity:.3}
.ex-badge{display:none;position:absolute;top:8px;right:8px;width:26px;height:26px;background:var(--green);border-radius:50%;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(74,222,128,.4)}
.ex-badge svg{width:14px;height:14px}
.ex-edit{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.5);border:0;color:#fff;width:28px;height:28px;border-radius:50%;font-size:.75rem;cursor:pointer;display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.ex-card:active .ex-edit,.ex-card:hover .ex-edit{display:flex}
.ex-body{padding:10px}
.ex-name{font-weight:600;font-size:.85rem;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ex-detail{font-size:.7rem;color:var(--dim)}
.ex-feel{display:flex;gap:4px;margin-top:6px}
.feel-btn{flex:1;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:6px;padding:4px 2px;font-size:.65rem;color:var(--dim);cursor:pointer;font-family:inherit;text-align:center;transition:all .15s}
.feel-btn.active{border-color:var(--orange);color:var(--orange);background:rgba(232,146,58,.1)}

/* Partner */
.partner{margin-top:24px;padding-top:18px;border-top:1px solid rgba(255,255,255,.06)}
.partner-hdr{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.partner-av{width:30px;height:30px;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:700}
.partner-nm{font-weight:600;font-size:.85rem}
.partner-st{font-size:.72rem;color:var(--dim)}
.partner-bar{background:rgba(255,255,255,.06);border-radius:8px;height:5px;overflow:hidden}
.partner-fill{height:100%;background:var(--blue);border-radius:8px;transition:width .5s}

/* Modal */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;align-items:flex-end;justify-content:center}
.modal-bg.active{display:flex}
.modal{background:var(--card);border-radius:20px 20px 0 0;padding:24px 20px 40px;width:100%;max-width:480px;max-height:85vh;overflow-y:auto}
.modal-center{border-radius:20px;max-width:420px;margin:auto}
.modal h2{font-size:1.05rem;margin-bottom:18px;color:var(--orange)}
.fg{margin-bottom:14px}
.fg label{display:block;font-size:.78rem;color:var(--dim);margin-bottom:5px}
.fg input,.fg textarea{width:100%;padding:10px 12px;background:var(--bg);border:1px solid rgba(255,255,255,.1);border-radius:8px;color:var(--text);font-family:inherit;font-size:.88rem;outline:0}
.fg input:focus,.fg textarea:focus{border-color:var(--orange)}
.frow{display:flex;gap:10px}.frow .fg{flex:1}

/* Mode Toggle */
.mode-tog{display:flex;border-radius:8px;overflow:hidden;border:1px solid rgba(255,255,255,.12)}
.mode-btn{flex:1;padding:8px;background:0;border:0;color:var(--dim);font-family:inherit;font-size:.82rem;font-weight:600;cursor:pointer;transition:all .2s}
.mode-btn.active{background:var(--orange);color:#fff}

/* Image Upload */
.img-up{width:100%;aspect-ratio:1.5;background:var(--bg);border:2px dashed rgba(255,255,255,.12);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;position:relative;transition:border-color .2s}
.img-up:active{border-color:var(--orange)}
.img-up img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.img-up .hint{color:var(--dim);font-size:.82rem;text-align:center}
.img-up .hint span{display:block;font-size:1.8rem;margin-bottom:6px}
.img-rm{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.6);color:#fff;border:0;width:28px;height:28px;border-radius:50%;font-size:1rem;cursor:pointer;z-index:2;backdrop-filter:blur(4px)}

.modal-btns{display:flex;gap:10px;margin-top:18px}
.modal-btns button{flex:1;padding:12px;border-radius:10px;font-family:inherit;font-size:.88rem;font-weight:600;cursor:pointer;border:0}
.btn-save{background:var(--orange);color:#fff}.btn-save:active{opacity:.8}
.btn-cancel{background:rgba(255,255,255,.08);color:var(--text)}
.btn-del{background:rgba(239,68,68,.12);color:var(--red)}

/* Report */
.rpt-tog{display:flex;border-radius:8px;overflow:hidden;border:1px solid rgba(255,255,255,.12)}
.rpt-tog button{flex:1;padding:8px;background:0;border:0;color:var(--dim);font-family:inherit;font-size:.78rem;font-weight:600;cursor:pointer;transition:all .2s}
.rpt-tog button.active{background:var(--orange);color:#fff}
.rpt-tabs{display:flex;gap:8px;margin-bottom:12px}
.rpt-tab{padding:6px 16px;border-radius:8px;border:1px solid rgba(255,255,255,.12);background:0;color:var(--dim);font-family:inherit;font-size:.78rem;font-weight:600;cursor:pointer;transition:all .2s}
.rpt-tab.active{background:var(--orange);color:#fff;border-color:var(--orange)}
.rpt-card{background:var(--card);border-radius:12px;padding:14px;margin-bottom:12px}
.rpt-card h3{font-size:.85rem;font-weight:700;margin-bottom:10px;color:var(--orange)}
.day-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:.75rem}
.day-lbl{width:32px;color:var(--dim);flex-shrink:0;text-align:right}
.day-bw{flex:1;background:rgba(255,255,255,.06);border-radius:4px;height:14px;overflow:hidden}
.day-b{height:100%;border-radius:4px;transition:width .5s;min-width:1px}
.day-p{width:32px;color:var(--dim);flex-shrink:0;font-size:.7rem}
.exs-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:.78rem}
.exs-row:last-child{border-bottom:0}.exs-pct{color:var(--orange);font-weight:700;width:40px;text-align:right}
.feel-sum{display:flex;gap:12px;margin-top:8px;font-size:.78rem}
.feel-sum b{color:var(--orange);font-weight:700}
.no-data{color:var(--dim);font-size:.8rem;text-align:center;padding:20px}

/* Changelog */
.cl-ver{color:var(--orange);font-weight:700;font-size:.88rem;margin-top:14px;margin-bottom:6px}
.cl-ver:first-child{margin-top:0}
.cl-item{color:var(--text);padding-left:12px;position:relative;margin-bottom:3px;font-size:.82rem;line-height:1.7}
.cl-item::before{content:'→';position:absolute;left:0;color:var(--orange)}
.cl-tag{display:inline-block;font-size:.65rem;font-weight:700;padding:1px 6px;border-radius:4px;margin-right:4px;vertical-align:middle}
.cl-new{background:rgba(74,222,128,.15);color:var(--green)}
.cl-fix{background:rgba(77,168,218,.15);color:var(--blue)}
.cl-imp{background:rgba(240,192,64,.15);color:var(--gold)}

@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.modal-bg.active .modal{animation:slideUp .3s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
</style>
</head>
<body>
<div class="container">

<!-- Select Screen -->
<div id="S1" class="screen active">
<div class="user-select">
  <img id="selPhil" class="phil-img" alt="Phil">
  <h1>Phil's Rehab HQ</h1>
  <p>选择你是谁，让 Phil 开始监工</p>
  <button class="user-btn" onclick="login('cici')">🐾 茜茜<span>脊椎康复小组 #1</span></button>
  <button class="user-btn" onclick="login('ivy')">🌿 Ivy<span>脊椎康复小组 #2</span></button>
</div>
</div>

<!-- Dashboard -->
<div id="S2" class="screen">
<div class="top-bar"><h1><em>Phil's</em> Rehab HQ</h1><button class="switch-user" onclick="logout()">切换用户</button></div>
<div class="phil-section"><img id="philImg" class="phil-img" alt="Phil"><div class="phil-quote" id="philQ"></div></div>
<div class="stats-bar">
  <div class="stat-card"><div class="stat-num" id="sStreak">0</div><div class="stat-label">🔥 连续</div></div>
  <div class="stat-card"><div class="stat-num" id="sPct">0%</div><div class="stat-label">📋 今日</div></div>
  <div class="stat-card"><div class="stat-num" id="sTotal">0</div><div class="stat-label">📅 累计</div></div>
</div>
<div class="comp-bar"><div class="comp-fill" id="compFill"></div></div>
<div class="sec-hdr"><div class="sec-title">今日动作</div><button class="add-btn" onclick="openAdd()">+ 添加</button></div>
<div class="ex-grid" id="exGrid"></div>

<!-- Report -->
<div style="margin-top:20px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center">
  <div class="sec-title">📊 数据报告</div>
  <div class="rpt-tog"><button class="active" onclick="setRptPeriod('week',this)">周报</button><button onclick="setRptPeriod('month',this)">月报</button></div>
</div>
<div class="rpt-tabs">
  <button class="rpt-tab active" onclick="setRptUser('cici',this)">🐾 茜茜</button>
  <button class="rpt-tab" onclick="setRptUser('ivy',this)">🌿 Ivy</button>
</div>
<div id="rptBox"></div>

<!-- Partner -->
<div class="partner">
  <div class="partner-hdr"><div class="partner-av" id="pAv"></div><div><div class="partner-nm" id="pNm"></div><div class="partner-st" id="pSt">今日尚未打卡</div></div></div>
  <div class="partner-bar"><div class="partner-fill" id="pFill" style="width:0%"></div></div>
</div>
</div>
</div>

<!-- Changelog Modal -->
<div class="modal-bg" id="clModal" onclick="if(event.target===this)closeCl()">
<div class="modal modal-center">
  <div style="text-align:center;margin-bottom:16px"><div style="font-size:2rem;margin-bottom:8px">🐾</div><h2 style="margin-bottom:4px">Phil's Rehab HQ</h2><div style="color:var(--dim);font-size:.78rem" id="clVer"></div></div>
  <div id="clContent" style="max-height:50vh;overflow-y:auto"></div>
  <div class="modal-btns" style="margin-top:16px"><button class="btn-save" onclick="closeCl()" style="flex:none;width:100%">知道了</button></div>
</div>
</div>

<!-- Exercise Modal -->
<div class="modal-bg" id="exModal" onclick="if(event.target===this)closeEx()">
<div class="modal">
  <h2 id="exTitle">添加动作</h2>
  <div class="fg"><label>动作示意图</label>
    <div class="img-up" id="imgArea" onclick="document.getElementById('imgIn').click()">
      <div class="hint" id="imgHint"><span>📷</span>点击上传图片</div>
      <img id="imgPrev" style="display:none">
      <button class="img-rm" id="imgRm" onclick="event.stopPropagation();rmImg()" style="display:none">✕</button>
    </div>
    <input type="file" id="imgIn" accept="image/*" style="display:none" onchange="onImg(event)">
  </div>
  <div class="fg"><label>动作名称</label><input type="text" id="fName" placeholder="如：桥式、猫牛式"></div>
  <div class="fg"><label>说明（可选）</label><input type="text" id="fDesc" placeholder="如：平躺双脚踩地，抬臀"></div>
  <div class="fg"><label>计量方式</label><div class="mode-tog"><button type="button" class="mode-btn active" id="mReps" onclick="setMode('reps')">次数</button><button type="button" class="mode-btn" id="mTime" onclick="setMode('time')">时间</button></div></div>
  <div class="frow">
    <div class="fg"><label>组数</label><input type="number" id="fSets" value="3" min="1"></div>
    <div class="fg" id="gReps"><label>每组次数</label><input type="number" id="fReps" value="10" min="1"></div>
    <div class="fg" id="gTime" style="display:none"><label>每组秒数</label><input type="number" id="fDur" value="30" min="1"></div>
  </div>
  <div class="modal-btns">
    <button class="btn-cancel" onclick="closeEx()">取消</button>
    <button class="btn-del" id="delBtn" onclick="delEx()" style="display:none">删除</button>
    <button class="btn-save" onclick="saveEx()">保存</button>
  </div>
</div>
</div>

let U = null, editId = null, tmpImg = '', exMode = 'reps', rptPeriod = 'week', rptUser = 'cici';

// ===== HELPERS =====
const K = s => `rehab_${U}_${s}`;
const td = () => new Date().toISOString().split('T')[0];

function loadEx() {
  const s = localStorage.getItem(K('exercises'));
  if (s) return JSON.parse(s);
  const d = DEF_EX[U] || [];
  localStorage.setItem(K('exercises'), JSON.stringify(d));
  return d;
}
function saveExData(list) { localStorage.setItem(K('exercises'), JSON.stringify(list)); }
function loadCk() { const s = localStorage.getItem(K('ck_' + td())); return s ? JSON.parse(s) : {}; }
function saveCk(data) {
  localStorage.setItem(K('ck_' + td()), JSON.stringify(data));
  const log = loadLog(); log[td()] = { rate: calcPct(), ts: new Date().toISOString(), ck: data };
  localStorage.setItem(K('daylog'), JSON.stringify(log));
  syncCheckin();
}
function loadLog() { const s = localStorage.getItem(K('daylog')); return s ? JSON.parse(s) : {}; }
function calcPct() { const ex = loadEx(), ck = loadCk(); if (!ex.length) return 0; return ex.filter(e => ck[e.id]?.done).length / ex.length; }
function calcStreak() {
  const log = loadLog(); let s = calcPct() >= .5 ? 1 : 0;
  const d = new Date(); d.setDate(d.getDate() - 1);
  for (let i = 0; i < 365; i++) { const k = d.toISOString().split('T')[0]; if (log[k]?.rate >= .5) { s++; d.setDate(d.getDate() - 1); } else break; }
  return s;
}
function totalDays() { return Object.values(loadLog()).filter(e => e.rate >= .5).length; }
function daysOff() {
  const log = loadLog(); let n = 0; const d = new Date();
  for (let i = 0; i < 30; i++) { const k = d.toISOString().split('T')[0]; if (!log[k] || log[k].rate < .5) { n++; d.setDate(d.getDate() - 1); } else break; }
  return n;
}
function mood() {
  if (calcStreak() >= 30) return 'insane';
  if (calcPct() >= 1) return 'reluctant';
  const off = daysOff();
  if (off >= 14) return 'middle_finger'; if (off >= 7) return 'leaving';
  if (off >= 3) return 'tattling'; if (off >= 2) return 'angry'; return 'disgusted';
}
function quote(m) { const q = PD[m]?.quotes || PD.disgusted.quotes; const seed = (td()+U).split('').reduce((a,c) => a + c.charCodeAt(0), 0); return q[seed % q.length]; }

// ===== RENDER =====
function render() {
  const exercises = loadEx(), ck = loadCk(), pct = calcPct(), m = mood();
  document.getElementById('philImg').src = 'data:image/png;base64,' + PI[m];
  document.getElementById('philQ').textContent = quote(m);
  document.getElementById('sStreak').textContent = calcStreak();
  document.getElementById('sPct').textContent = Math.round(pct*100)+'%';
  document.getElementById('sTotal').textContent = totalDays();
  const f = document.getElementById('compFill');
  f.style.width = (pct*100)+'%';
  f.style.background = pct >= 1 ? 'var(--green)' : pct >= .5 ? 'var(--orange)' : 'var(--red)';

  document.getElementById('exGrid').innerHTML = exercises.map(ex => {
    const d = ck[ex.id]?.done || false, fe = ck[ex.id]?.feeling || '';
    const det = ex.mode === 'time' ? ex.sets+'组 × '+(ex.duration||30)+'秒' : ex.sets+'组 × '+(ex.reps||10)+'次';
    return `<div class="ex-card ${d?'done':''}" onclick="toggle('${ex.id}')">
      <div class="ex-img">${ex.img ? `<img src="${ex.img}">` : '<div class="ex-ph">🏋️</div>'}
        <div class="ex-badge"><svg viewBox="0 0 16 16" fill="none"><path d="M3 8L6.5 11.5L13 4.5" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <button class="ex-edit" onclick="event.stopPropagation();openEdit('${ex.id}')">✏️</button>
      </div>
      <div class="ex-body"><div class="ex-name">${ex.name}</div><div class="ex-detail">${det}</div>
        ${d ? `<div class="ex-feel">
          <button class="feel-btn ${fe==='good'?'active':''}" onclick="event.stopPropagation();setFeel('${ex.id}','good')">😊</button>
          <button class="feel-btn ${fe==='okay'?'active':''}" onclick="event.stopPropagation();setFeel('${ex.id}','okay')">😐</button>
          <button class="feel-btn ${fe==='pain'?'active':''}" onclick="event.stopPropagation();setFeel('${ex.id}','pain')">😣</button>
        </div>` : ''}
      </div></div>`;
  }).join('');

  // Partner
  const p = U === 'cici' ? 'ivy' : 'cici', pn = p === 'cici' ? '茜茜' : 'Ivy';
  document.getElementById('pAv').textContent = p === 'cici' ? '🐾' : '🌿';
  document.getElementById('pNm').textContent = pn + ' 的进度';
  const pEx = JSON.parse(localStorage.getItem(`rehab_${p}_exercises`) || '[]');
  const pCk = JSON.parse(localStorage.getItem(`rehab_${p}_ck_${td()}`) || '{}');
  const pD = pEx.filter(e => pCk[e.id]?.done).length, pT = pEx.length || 1, pR = pD/pT;
  document.getElementById('pSt').textContent = pD === 0 ? '今日尚未打卡' : pR >= 1 ? '今日全部完成 ✅' : `已完成 ${pD}/${pT}`;
  document.getElementById('pFill').style.width = (pR*100)+'%';
  renderRpt();
}

function onImg(e) {
  const file = e.target.files[0]; if (!file) return;
  const r = new FileReader(); r.onload = ev => {
    const img = new Image(); img.onload = () => {
      const c = document.createElement('canvas'); const maxW = 400;
      let w = img.width, h = img.height; if (w > maxW) { h = h*maxW/w; w = maxW; }
      c.width = w; c.height = h; c.getContext('2d').drawImage(img,0,0,w,h);
      tmpImg = c.toDataURL('image/jpeg',.75); showPrev(tmpImg);
    }; img.src = ev.target.result;
  }; r.readAsDataURL(file);
}
function showPrev(src) { const p = document.getElementById('imgPrev'); p.src = src; p.style.display = 'block'; document.getElementById('imgHint').style.display = 'none'; document.getElementById('imgRm').style.display = 'block'; }

}
function openEdit(id) {
  const ex = loadEx().find(e => e.id === id); if (!ex) return;
  editId = id; document.getElementById('exTitle').textContent = '编辑动作';
  document.getElementById('fName').value = ex.name; document.getElementById('fDesc').value = ex.desc || '';
  document.getElementById('fSets').value = ex.sets; document.getElementById('fReps').value = ex.reps || 10; document.getElementById('fDur').value = ex.duration || 30;
  setMode(ex.mode || 'reps');
  if (ex.img) { tmpImg = ex.img; showPrev(ex.img); } else rmImg();
  document.getElementById('delBtn').style.display = 'block';
  document.getElementById('exModal').classList.add('active');
}
function saveEx() {
  const name = document.getElementById('fName').value.trim(); if (!name) return;
  const exercises = loadEx();
  const data = { id: editId || 'ex_' + Date.now(), name, desc: document.getElementById('fDesc').value.trim(),
    sets: parseInt(document.getElementById('fSets').value)||3, reps: parseInt(document.getElementById('fReps').value)||10,
    duration: parseInt(document.getElementById('fDur').value)||30, mode: exMode, img: tmpImg };
  if (editId) { const i = exercises.findIndex(e => e.id === editId); if (i >= 0) exercises[i] = data; } else exercises.push(data);
  saveExData(exercises); syncExToSheet(data); closeEx(); render();
}
function delEx() { if (!editId) return; syncDelEx(editId); saveExData(loadEx().filter(e => e.id !== editId)); closeEx(); render(); }
function closeEx() { document.getElementById('exModal').classList.remove('active'); }

// ===== SYNC: CHECKINS =====
function syncCheckin() {
  if (!U) return;
  const ck = loadCk(), rate = calcPct();
  const p = new URLSearchParams({action:'write',date:td(),user:U,data:JSON.stringify(ck),rate:String(rate),timestamp:new Date().toISOString()});
  fetch(SCRIPT_URL+'?'+p, {mode:'no-cors'}).catch(()=>{});
}
function fetchPartner() {
  if (!U) return;
  const p = U==='cici'?'ivy':'cici';
  fetch(SCRIPT_URL+'?'+new URLSearchParams({action:'partner',user:p,date:td()}))
    .then(r=>r.json()).then(d=>{
      if (d.status==='ok'&&d.result) { localStorage.setItem(`rehab_${p}_ck_${td()}`, d.result.data||'{}'); render(); }
    }).catch(()=>{});
}
function fetchOwn() {
  if (!U) return;
  fetch(SCRIPT_URL+'?'+new URLSearchParams({action:'read',user:U,date:td()}))
    .then(r=>r.json()).then(d=>{
      if (d.status==='ok'&&d.results?.length>0) {
        const local = loadCk();
        if (!Object.keys(local).length && d.results[0].data && d.results[0].data !== '{}') {
          localStorage.setItem(K('ck_'+td()), d.results[0].data); render();
        }
      }
    }).catch(()=>{});
}

// ===== SYNC: EXERCISES (POST via iframe) =====
function syncExToSheet(ex) {
  if (!U) return;
  const iframe = document.createElement('iframe'); iframe.style.display='none'; iframe.name='sf_'+Date.now(); document.body.appendChild(iframe);
  const form = document.createElement('form'); form.method='POST'; form.action=SCRIPT_URL; form.target=iframe.name; form.style.display='none';
  const fields = {action:'save_exercise',user:U,id:ex.id,name:ex.name,desc:ex.desc||'',sets:String(ex.sets),reps:String(ex.reps||10),img:ex.img||''};
  Object.entries(fields).forEach(([k,v])=>{const i=document.createElement('input');i.type='hidden';i.name=k;i.value=v;form.appendChild(i);});
  document.body.appendChild(form); form.submit();
  setTimeout(()=>{try{document.body.removeChild(form);document.body.removeChild(iframe);}catch(e){}},10000);
}
function syncDelEx(id) {
  if (!U) return;
  fetch(SCRIPT_URL+'?'+new URLSearchParams({action:'delete_exercise',user:U,id}),{mode:'no-cors'}).catch(()=>{});
}
function fetchExCloud() {
  if (!U) return;
  fetch(SCRIPT_URL+'?'+new URLSearchParams({action:'load_exercises',user:U}))
    .then(r=>r.json()).then(d=>{
      if (d.status==='ok'&&d.exercises?.length>0) {
        const local = loadEx(), cloud = d.exercises, merged = [...cloud];
        local.forEach(loc=>{
          const ci = merged.findIndex(c=>c.id===loc.id);
          if (ci<0) merged.push(loc);
          else if (loc.img && loc.img.length > (merged[ci].img||'').length) merged[ci].img = loc.img;
        });
        saveExData(merged); render();
      }
    }).catch(()=>{});
}

// ===== REPORT =====
function setRptPeriod(p,btn) { rptPeriod=p; btn.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); renderRpt(); }
function setRptUser(u,btn) { rptUser=u; btn.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); renderRpt(); }
function renderRpt() {
  const days = rptPeriod==='week'?7:30, dl = ['日','一','二','三','四','五','六'];
  const log = JSON.parse(localStorage.getItem('rehab_'+rptUser+'_daylog')||'{}');
  const exercises = JSON.parse(localStorage.getItem('rehab_'+rptUser+'_exercises')||'[]');
  const dd = [];
  for (let i=days-1;i>=0;i--) { const d=new Date();d.setDate(d.getDate()-i);const k=d.toISOString().split('T')[0];const e=log[k];dd.push({k,rate:Math.round((e?.rate||0)*100),label:rptPeriod==='week'?dl[d.getDay()]:(d.getMonth()+1)+'/'+d.getDate(),entry:e}); }
  const exS = {}; const fc = {good:0,okay:0,pain:0}; exercises.forEach(ex=>{exS[ex.id]={name:ex.name,done:0,total:0};});
  for (let i=days-1;i>=0;i--) { const d=new Date();d.setDate(d.getDate()-i);const k=d.toISOString().split('T')[0];const e=log[k];
    if (e?.ck) { const ck=typeof e.ck==='string'?JSON.parse(e.ck):e.ck; exercises.forEach(ex=>{if(exS[ex.id]){exS[ex.id].total++;if(ck[ex.id]?.done){exS[ex.id].done++;const f=ck[ex.id]?.feeling;if(f&&fc[f]!==undefined)fc[f]++;}}}); }
    else exercises.forEach(ex=>{if(exS[ex.id])exS[ex.id].total++;});
  }
  const avg = dd.length?Math.round(dd.reduce((a,d)=>a+d.rate,0)/dd.length):0;
  const act = dd.filter(d=>d.rate>0).length;
  let h = `<div class="rpt-card"><h3>${rptPeriod==='week'?'本周概览':'本月概览'}</h3>`;
  h += `<div style="display:flex;gap:16px;font-size:.82rem;margin-bottom:8px"><div>平均完成率 <b style="color:var(--orange)">${avg}%</b></div><div>打卡天数 <b style="color:var(--orange)">${act}/${days}</b></div></div>`;
  dd.forEach(d=>{const c=d.rate>=100?'var(--green)':d.rate>=50?'var(--orange)':d.rate>0?'var(--red)':'rgba(255,255,255,.06)';
    h+=`<div class="day-row"><div class="day-lbl">${d.label}</div><div class="day-bw"><div class="day-b" style="width:${Math.max(d.rate,2)}%;background:${c}"></div></div><div class="day-p">${d.rate}%</div></div>`;
  }); h += '</div>';
  const exL = Object.values(exS).sort((a,b)=>(a.total?a.done/a.total:0)-(b.total?b.done/b.total:0));
  if (exL.length) { h += '<div class="rpt-card"><h3>各动作完成率</h3>'; exL.forEach(ex=>{const p=ex.total?Math.round(ex.done/ex.total*100):0;h+=`<div class="exs-row"><div>${ex.name}</div><div class="exs-pct">${p}%</div></div>`;}); h+='</div>'; }
  const tf=fc.good+fc.okay+fc.pain;
  if (tf) { h += `<div class="rpt-card"><h3>运动后感觉</h3><div class="feel-sum"><div>😊 <b>${fc.good}</b></div><div>😐 <b>${fc.okay}</b></div><div>😣 <b>${fc.pain}</b></div></div></div>`; }
  if (dd.every(d=>d.rate===0)) h = `<div class="no-data">暂无${rptUser==='cici'?'茜茜':'Ivy'}的打卡数据</div>`;
  document.getElementById('rptBox').innerHTML = h;
}

// ===== CHANGELOG =====
function checkCl() { if (localStorage.getItem('rehab_lastVersion') !== APP_VERSION) showCl(); }
function showCl() {
  document.getElementById('clVer').textContent = APP_VERSION;
  const tm = {new:'<span class="cl-tag cl-new">NEW</span>',fix:'<span class="cl-tag cl-fix">FIX</span>',imp:'<span class="cl-tag cl-imp">优化</span>'};
  let h = ''; CHANGELOG.forEach(r=>{h+=`<div class="cl-ver">${r.v} · ${r.d}${r.v===APP_VERSION?' <span style="color:var(--green);font-size:.7rem">← 当前</span>':''}</div>`;r.items.forEach(i=>{h+=`<div class="cl-item">${tm[i.t]||''}${i.x}</div>`;});});
  document.getElementById('clContent').innerHTML = h;
  document.getElementById('clModal').classList.add('active');
}
function closeCl() { localStorage.setItem('rehab_lastVersion', APP_VERSION); document.getElementById('clModal').classList.remove('active'); }

// ===== INIT =====
document.getElementById('selPhil').src = 'data:image/png;base64,' + PI.disgusted;
const su = localStorage.getItem('rehab_currentUser');
if (su) login(su);
setInterval(()=>{if(U)fetchPartner();},60000);
if ('serviceWorker' in navigator) {
  // 强制检查更新，版本号变化时自动刷新
  navigator.serviceWorker.register('sw.js?v=3').then(reg => {
    reg.addEventListener('updatefound', () => {
      const nw = reg.installing;
      nw.addEventListener('statechange', () => {
        if (nw.state === 'activated') {
          // 新 service worker 已激活，自动刷新页面
          if (localStorage.getItem('rehab_sw_version') !== 'v3') {
            localStorage.setItem('rehab_sw_version', 'v3');
            location.reload();
          }
        }
      });
    });
    // 每次打开都检查更新
    reg.update();
  });
}
